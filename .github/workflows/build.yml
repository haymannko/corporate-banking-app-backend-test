











name: CI Build

on:
  workflow_run:
    workflows: ["Change Detection"]     # 👈 triggers only after your Change Detection workflow
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Changed Services
    runs-on: ubuntu-latest

    # 🧠 Only run if Change Detection found changes
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Download matrix artifact
        uses: actions/download-artifact@v4
        with:
          name: build-matrix
          path: artifacts

      - name: Read matrix and parent pom change info
        id: read-matrix
        run: |
          echo "Reading matrix file..."
          MATRIX=$(cat artifacts/matrix.json | jq -r '. | join(",")')
          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

          POM_CHANGED=$(cat artifacts/parent-pom-changed.txt)
          echo "Parent POM changed: $POM_CHANGED"
          echo "parent_changed=$POM_CHANGED" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build changed services
        if: ${{ steps.read-matrix.outputs.matrix != '' }}
        run: |
          IFS=',' read -ra SERVICES <<< "${{ steps.read-matrix.outputs.matrix }}"
          for SERVICE in "${SERVICES[@]}"; do
            echo "🧱 Building $SERVICE ..."
            cd app/$SERVICE
            mvn -B clean package -DskipTests
            cd ../..
          done

      - name: Build all services (Parent POM or Workflow changed)
        if: ${{ steps.read-matrix.outputs.parent_changed == 'true' }}
        run: |
          echo "🔄 Parent POM changed, rebuilding all services..."
          mvn -B clean package -DskipTests
